<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 园境</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#274455;font:15px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(420px,90vw);padding:40px;background:white;border:1px solid #dde5e9;border-radius:20px;box-shadow:0 16px 60px #14392e0b}small{color:#16816c;letter-spacing:3px}h1{margin:18px 0 10px}p{line-height:1.7;color:#6c8292}label{display:block;margin:22px 0 8px}input,button{font:inherit;width:100%;padding:13px;border-radius:8px;border:1px solid #cddbe2}button{margin-top:26px;background:#147963;color:white;border:0;cursor:pointer}#error{color:#aa382e;min-height:24px}</style><main><small>COURTYARD · 园境</small><h1>欢迎回来</h1><p>登录后，管理园区、查看账单与收款记录。</p><form method="post" action="/auth/login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="40"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button>登录园区</button></form><p id="error"></p><script>if(location.search.includes('error'))document.getElementById('error').textContent='账号或密码不正确，或尝试过于频繁，请稍后重试。';</script></main></html>
